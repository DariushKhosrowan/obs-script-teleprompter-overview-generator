<script>
const S=[{"n": 1, "act": 1, "lay": "اسلاید تمام‌صفحه", "slide": 1, "time": "0:00", "text": "فرض کن گوشیت زنگ می‌خوره و پشت خط بهت می‌گن بچه‌ت یا همسرت رو دزدیدن. می‌گن اگه تا فردا شب فلان مبلغ رو نرسونی، دیگه نمی‌بینیش."}, {"n": 2, "act": 1, "lay": "اسلاید + من", "slide": 1, "time": "", "text": "اگه همچین اتفاقی بیفته، چی کار می‌کنی؟ به پلیس زنگ می‌زنی و دست روی دست می‌ذاری، یا پول رو جور می‌کنی و می‌دی؟"}, {"n": 3, "act": 1, "lay": "اسلاید + من", "slide": 2, "time": "0:25", "text": "این سؤالِ بی‌جواب نیست. توی دهه‌ی ۷۰ و ۸۰ میلادی توی ایتالیا، دقیقاً برای اینکه خانواده‌ها حق داشتن بخوان عزیزشون زنده برگرده، باج می‌دادن. نتیجه‌ش چی شد؟ بین سال‌های ۱۹۶۹ تا ۱۹۹۱، حدود ۶۳۰ نفر توی ایتالیا ربوده شدن. تا اینکه سال ۱۹۹۱ دولت یه قانونِ به‌ظاهر بی‌رحمانه گذاشت: به محض اینکه گزارش آدم‌ربایی می‌اومد، حسابِ بانکیِ خودِ خانواده‌ی قربانی مسدود می‌شد که حتی اگه بخوان هم نتونن باج بدن."}, {"n": 4, "act": 1, "lay": "اسلاید تمام‌صفحه", "slide": 3, "time": "", "text": "توی هفت سال بعد از اون قانون، آمار آدم‌ربایی اومد پایین و شد فقط ۳۸ مورد. البته تاریخ‌دان‌ها و جرم‌شناس‌ها می‌گن فقط اون قانون نبود—هم‌زمان فشار پلیس بیشتر شد، مافیا هم سرمایه‌ش رو برد سمت قاچاق کوکائین، و بعضی خانواده‌ها هم پنهانی پول دادن و گزارش نکردن."}, {"n": 5, "act": 1, "lay": "اسلاید + من", "slide": 4, "time": "", "text": "ولی یک چیز کاملاً روشن شد: وقتی آدم‌ربایی دیگه پول درنمی‌آورد، دزدها هم کم‌کم دست کشیدن."}, {"n": 6, "act": 1, "lay": "اسلاید + من", "slide": 4, "time": "0:58", "text": "ماجرای فقط سرِ آدم‌ربایی نیست. توی زندگی هرروزه‌مون هم همینه: مشتری‌ای که پولتو نگه داشته و می‌گه «فقط این یه تغییر کوچیکم بزن تا تسویه کنم»، همکاری که کار خودشو می‌ندازه گردنت، یا کارفرمایی که حقوقتو با وعده‌ی هفته‌ی بعد عقب می‌ندازه."}, {"n": 7, "act": 1, "lay": "اسلاید + من", "slide": 5, "time": "", "text": "اینجا تفنگی روی سرت نیست؛ ولی قانون دقیقاً یکیه: هر رفتاری که پاداشش بدی، بیشتر می‌شه. اگه وقتی یکی پاشو می‌ذاره روی حقت، تو کوتاه بیای که دعوا نشه، دقیقاً داری یادش می‌دی این کار جواب می‌ده—و توی دفعه‌ی بعدی، هم برای تو بدتر می‌شه، هم سرِ نفر بعدی پیاده‌ش می‌کنه."}, {"n": 8, "act": 1, "lay": "اسلاید + من", "slide": 6, "time": "", "text": "فقط یک پیچیدگیِ مهم هست: اگه قراره هیچ‌وقت کوتاه نیایم، پس چرا گاهی مجبوری پول بدی؟ و تکلیف آدمِ ضعیف و بی‌پناه که واقعاً دستش خالیه چی می‌شه؟"}, {"n": 9, "act": 2, "lay": "اسلاید + من", "slide": 7, "time": "1:25", "text": "اول ببین توی روابط معمولی چه اتفاقی می‌افته. تصور کن کار طراحی یا تدوین می‌کنی. قیمت رو طی کردی، وسط کار مشتری پیام می‌ده: «راستی می‌شه این دو تا بخش جدیدم اضافه کنی؟ کار پنج دقیقه‌ست.» تو می‌دونی کار دو ساعته. دفعه‌ی اول می‌گی توی قرارمون نبوده. دفعه‌ی دومم نه می‌گی. اما بار سوم، طرف یکم لحنش رو مظلوم می‌کنه یا با کنایه می‌گه «ما روت حساب کرده بودیم رفیق!» و تو دیگه حوصله‌ی کل‌کل نداری؛ می‌گی باشه، می‌زنم."}, {"n": 10, "act": 2, "lay": "اسلاید + من", "slide": 8, "time": "", "text": "به‌نظر میاد یه لطف کوچیک کردی و تموم شد، نه؟ ولی یه اتفاقِ خیلی بدتر افتاده. سال ۱۹۵۷، بی. اف. اسکینر و همکارش روی رفتار حیوان‌ها و آدم‌ها یه آزمایش جالب کردن. دیدن اگه هر بار که طرف یه کاری می‌کنه بهش پاداش بدی، به‌محض اینکه پاداش رو قطع کنی، خیلی زود دست می‌کشه."}, {"n": 11, "act": 2, "lay": "اسلاید تمام‌صفحه", "slide": 9, "time": "", "text": "اما اگه فقط گاهی—مثلاً بعد از سه بار یا پنج بار اصرار و فشار—بهش پاداش بدی، دیگه دست‌بردار نیست؛ حتی وقتی برای همیشه قطعش می‌کنی، بازم هی امتحان می‌کنه. دقیقاً مثل دستگاه قمار که آدم رو تا ساعت‌ها پاش نگه می‌داره چون می‌دونه «شاید دفعه‌ی بعدی دربیاد». وقتی تو دو بار نه می‌گی و بار سوم زیر فشار کوتاه می‌آی، به مشتری یاد ندادی احترامت رو نگه داره؛ یادش دادی که «فقط کافیه یکم بیشتر فشار بیارم تا بالاخره وا بده»."}, {"n": 12, "act": 2, "lay": "اسلاید + من", "slide": 10, "time": "", "text": "و از اون طرف، خودتم اون لحظه از شرِ تنش و رودربایستی خلاص شدی؛ پس مغزِ خودتم یاد می‌گیره کوتاه اومدن یه راه سریع برای راحت شدنه. این‌جوری دوتایی معامله می‌کنید: تو اعصابِ راحتِ اون لحظه رو می‌خری، و در عوض پرروییِ دفعه‌ی بعدشو تأمین مالی می‌کنی."}, {"n": 13, "act": 2, "lay": "اسلاید + من", "slide": 11, "time": "2:35", "text": "حالا شاید بگی: «من که راحت کوتاه نمیام! غُر می‌زنم، اخم می‌کنم، بهش می‌فهمونم ناراضی‌ام.» ببین غر زدنِ بدون هزینه چه بلایی سرت میاره. سال ۲۰۰۰ توی شهر حیفا، دو تا اقتصاددان اومدن توی ۱۰ تا مهدکودک یه آزمایش ۲۰ هفته‌ای گذاشتن. ساعت تعطیلی ۴ بعدازظهر بود، ولی بعضی پدر و مادرها دیر می‌اومدن دنبال بچه‌شون و مربی معطل می‌شد."}, {"n": 14, "act": 2, "lay": "اسلاید تمام‌صفحه", "slide": 12, "time": "", "text": "محقق‌ها توی ۶ تا از مهدکودک‌ها یه جریمه‌ی کوچیک گذاشتن: هرکی بیشتر از ۱۰ دقیقه دیر برسه، معادلِ حدود ۳ دلار جریمه می‌ده. انتظار داشتن تأخیرها کمتر بشه، نه؟ اتفاقاً بیش از دو برابر شد! میانگین تأخیر از هفته‌ای ۸ بار رسید به بالای ۱۶ بار—و عجیب‌تر اینکه وقتی چند هفته بعد جریمه رو برداشتن، دیگه برنگشت سر جای اولش؛ رفت روی نزدیکِ ۱۹ بار در هفته."}, {"n": 15, "act": 2, "lay": "اسلاید + من", "slide": 13, "time": "", "text": "چرا این‌طوری شد؟ چون قبل از جریمه، پدر و مادرها معذب بودن؛ حس می‌کردن دارن حقِ مربی رو می‌خورن. وقتی یک جریمه‌ی کوچیک و ناچیز گذاشتن، اون عذاب‌وجدان از بین رفت؛ حس کردن با ۳ دلار دارن نیم ساعت وقت مربی رو می‌خرن. (پژوهش‌های بعدی هم نشون دادن این اتفاق وقتی می‌افته که هزینه کوچیک و بی‌اثر باشه)."}, {"n": 16, "act": 2, "lay": "اسلاید + من", "slide": 13, "time": "", "text": "توی شرکت هم دقیقاً همینه: وقتی همکارت کارشو می‌ندازه سرت و تو فقط اخم می‌کنی و چهارتا تیکه می‌ندازی، ولی آخرش انجامش می‌دی، اون اخمِ تو حتی از ۳ دلار هم ارزون‌تره! یعنی هم کارش راه افتاده، هم دیگه خجالت نمی‌کشه. هزینه‌ی پررویی رو خودت کشیدی، پس دفعه‌ی بعد با خیال راحت‌تر برمی‌گرده."}, {"n": 17, "act": 3, "lay": "اسلاید تمام‌صفحه", "slide": 14, "time": "3:50", "text": "توی مقیاس کلان هم دقیقاً همین قانون کار می‌کنه. پژوهشِ تاد سندلر روی آدم‌ربایی‌های بین‌المللی نشون داد کشورهایی که با گروگان‌گیرها معامله کردن و باج دادن، توی سال‌های ۲۰۰۱ تا ۲۰۱۳ بین ۶۴ تا ۸۷ درصد آدم‌ربایی‌های بیشتری رو تجربه کردن. چون دقیقاً به آدم‌ربا ثابت شد این کار می‌صرفه."}, {"n": 18, "act": 3, "lay": "اسلاید + من", "slide": 15, "time": "", "text": "توی حملات باج‌افزاری به شرکت‌ها هم همین‌طوره؛ توی یه نظرسنجی بین نزدیک به ۱۵۰۰ مدیر امنیتِ شرکت‌های بزرگ، ۸۰ درصدِ شرکت‌هایی که یک‌بار به هکرها پول دادن، دوباره بهشون حمله شد—و بیشترشون دفعه‌ی بعد پول بالاتری هم دادن. قانون تا اینجا که خیلی واضحه: باج می‌دی، باج‌گیر بزرگ‌تر می‌شه."}, {"n": 19, "act": 3, "lay": "اسلاید تمام‌صفحه", "slide": 16, "time": "4:50", "text": "پس چرا توی دنیای واقعی همه‌چیز با یک «نهِ سفت و محکم» حل نمی‌شه؟ بیاین یه آمار خیلی تلخ رو ببینیم. توی بررسی ۱٬۱۸۵ پرونده‌ی گروگان‌گیری بین سال‌های ۲۰۰۱ تا ۲۰۱۶، آمریکا سیاست رسمیِ «عدم مذاکره» داشت. شهروندهای آمریکایی فقط حدود ۲۰ درصدِ گروگان‌های غربی بودن، اما نزدیک به نصفِ—حدود ۵۰ درصدِ—همه‌ی گروگان‌های کشته‌شده‌ی غربی، آمریکایی بودن. البته دشمنی شدید گروه‌های جهادی با آمریکا توی این عدد بی‌تأثیر نبود، ولی گزارش موسسه‌ی رَند (RAND) صریحاً می‌گه: سیاستِ سختِ باج ندادن ممکنه برای آینده بازدارندگی بسازه، اما جونِ گروگانِ فعلی رو شدیداً به خطر می‌ندازه."}, {"n": 20, "act": 3, "lay": "اسلاید + من", "slide": 17, "time": "", "text": "اینجاست که باید یک فرق اساسی توی زندگی خودمون بذاریم: فرقِ بین رابطه‌ای که می‌خوای ادامه بدی با جایی که گیر افتادی. فرض کن مهاجری هستی توی یه کشور دیگه؛ ودیعه‌ی خونه‌ت یا تمدید ویزات دست یه صاحبخونه یا کارفرمای بدقلقه، و الان هیچ وکیل و پناه سریعی نداری که اگه دعوا شد پشتتو بگیره."}, {"n": 21, "act": 3, "lay": "اسلاید + من", "slide": 18, "time": "", "text": "یا کارگری هستی که دو ماه حقوقش عقب افتاده و اگه همین امروز در رو ببندی و بری، اجاره‌خونه‌ت می‌مونه. اینجا تو وسط یه چانه‌زنیِ معمولی نیستی که بخوای طرف رو تربیت کنی؛ واقعاً گیر افتادی و معیشت یا سقفت در خطره. توی همچین موقعیتی، اگه مجبور شدی برای نجاتِ امروز کوتاه بیای، یا حتی بخشی از خسارت رو قبول کنی که لااقل اصل پولت رو زنده کنی، ایرادی نداره."}, {"n": 22, "act": 3, "lay": "اسلاید + من", "slide": 18, "time": "", "text": "اما نکته‌ش اینجاست: باج دادنِ امروز فقط وقتی منطقیه که قرار نباشه فردا هم کنار همین آدم بمونی! اگه کوتاه اومدی که اصلِ حقت رو بکشی بیرون و بعد از همون شب دنبال خونه یا کارِ جدید بری تا بازی رو برای همیشه ببندی، خودت رو نجات دادی. ولی اگه کوتاه بیای و بازم بمونی، دقیقاً همون رفتاری رو تأمین مالی کردی که ماهِ بعد دوباره سرت میاد."}, {"n": 23, "act": 4, "lay": "اسلاید + من", "slide": 19, "time": "6:45", "text": "حالا این وسط یک جای کار خیلی می‌لنگه که اگه حلش نکنیم، کلِ این حرف‌ها آدم رو تبدیل می‌کنه به یک آدمِ تلخ و بی‌رحم. اگه هر رفتاری که پاداشش بدی بیشتر می‌شه، پس نباید به دستفروشِ سرِ چهارراه تخفیف ندیم؟ نباید از کارگرِ روزمزدی که تصادفاً یه لیوان رو شکسته مزدش رو کم کنیم که دفعهٔ بعد حواسشو جمع کنه؟ جواب این سؤال توی یکی از معروف‌ترین آزمایش‌های اقتصاد سلامت توی آمریکا دراومده—آزمایش RAND روی چند هزار نفر. محقق‌ها دیدن وقتی خدمات پزشکی برای آدم‌های عادی و سالم رایگان بود، مصرفشون حدود ۵۰ درصد رفت بالا—یعنی آدمِ توانمند وقتی هزینه‌ای نمی‌ده، بی‌ملاحظه استفاده می‌کنه."}, {"n": 24, "act": 4, "lay": "اسلاید تمام‌صفحه", "slide": 20, "time": "", "text": "اما توی همون آزمایش، وقتی اومدن روی گروهِ کم‌درآمدی که فشار خون بالا داشتن هزینه گذاشتن، دیگه نتونستن درست پیگیری کنن و احتمالِ پیش‌بینی‌شده‌ی مرگشون ۱۴ درصد رفت بالا! می‌بینی؟ گذاشتن هزینه جلوی آدمِ توانا و سالم، سوءاستفاده رو کم می‌کنه؛ ولی گذاشتنِ همون فشار روی آدمِ بی‌پناه، عملاً نابودش می‌کنه. حالا اینو بیار روی همون قانون اولمون—که «هر رفتاری که پاداشش بدی بیشتر می‌شه»—تا ببینی چرا مروت با بی‌پناه یه چیزِ احساساتی و بی‌ربط نیست، دقیقاً ادامه‌ی همون منطقه: وقتی تو جلوی کارفرما و صاحبخونه‌ی گردن‌کلفت کوتاه می‌آی، ولی فرداش سرِ بیست تومن با دستفروش چانه می‌زنی یا دستمزد کارگر خسته رو بابت یه اشتباهِ کوچک می‌بُری، داری چه رفتاری رو توی دنیا تشویق می‌کنی؟"}, {"n": 25, "act": 4, "lay": "اسلاید + من", "slide": 21, "time": "", "text": "به آدمِ ساده و زحمت‌کش یاد می‌دی که صداقت و کار کردن فایده‌ای نداره، چون هر کی زورش بیشتره می‌بره؛ پس فردا یا دلش می‌شکنه و بی‌انگیزه می‌شه، یا یاد می‌گیره اونم کلک بزنه تا بتونه زنده بمونه! اما وقتی به دستفروشِ زحمت‌کش یا کارگری که بی‌غرض کار کرده مروت نشون می‌دی، داری به زحمت، آبرومندی و صداقت پاداش می‌دی—و دقیقاً همون چیزی رو توی دوروبرت زیاد می‌کنی که خودت بهش نیاز داری."}, {"n": 26, "act": 4, "lay": "اسلاید + من", "slide": 22, "time": "8:05" اجتماعی—دقیقاً همون وقتی که همکارت بهت می‌گه «چرا جو می‌دی؟ حالا یه ساعت بیشتر وایسا دیگه!»."}, {"n": 31, "act": 5, "lay": "اسلاید + من", "slide": 27, "time": "10:25", "text": "پس چطور هم به پررویی پاداش ندیم، هم توی شلوغ‌بازی و دعوا گیر نیفتیم؟ توی معروف‌ترین مسابقه‌ی نظریه‌ی بازی‌ها که رابرت اکسلراد برگزار کرد (اول با ۱۵ برنامه و بعد ۶۳ برنامه کامپیوتری)، یک استراتژیِ خیلی ساده از همه‌ی برنامه‌های پیچیده و حقهٔ‌باز برد: این‌به‌آن‌در (Tit-for-Tat). با ۴ تا قاعده‌ی ساده: اول: تو هیچ‌وقت شروع‌کننده‌ی بدقولی و بدی نباش. دوم: به محض اینکه طرف از خط رد شد، همون لحظه واکنش نشون بده (صبر نکن بشه عادت)."}, {"n": 32, "act": 5, "lay": "اسلاید تمام‌صفحه", "slide": 28, "time": "", "text": "سوم: اگه طرف خطاشو جمع کرد و درست شد، کینه رو بذار کنار—چون بالاخره اشتباه و سوءتفاهم توی کار پیش می‌آد. چهارم: رفتارت واضح و قابل‌پیش‌بینی باشه. و برای اینکه موقع «نه» گفتن توی دعوای شخصی نیفتی و طرف نتونه تو رو آدمِ خسیسِ بدخلق نشون بده، از ایده‌ی تعهد از پیشِ توماس شِلینگ استفاده کن: خطت رو روز اولِ کار، توی آرامش بذار، نه وسط دعوا!"}, {"n": 33, "act": 5, "lay": "اسلاید + من", "slide": 29, "time": "", "text": "قبل از شروع پروژه به مشتری می‌نویسی: «۵۰ درصد پیش‌پرداخت، تا دو تا تغییر، فایل نهایی بعد از تسویه.» به همکارت روزهای عادی می‌گی: «من تا ساعت ۵ می‌تونم کمک کنم، بعدش کار شخصی دارم.» اون‌وقت اگه بعداً فشار آورد، نمی‌گی «تو پررویی!»؛ خیلی آروم می‌گی «روز اول قرارمون سر دو تا تغییر بود، از این به بعدش حسابش جداست». اینجا تو دعوا نکردی؛ قراردادت داره نه می‌گه!"}, {"n": 34, "act": 6, "lay": "اسلاید تمام‌صفحه", "slide": 30, "time": "11:25", "text": "خلاصه‌ش؟ قبل از اینکه سر هر درخواستی کوتاه بیای یا سخت بگیری، توی ذهنت فقط این سه تا سؤال رو چک کن: ۱. کی زیر فشاره و کی داره از بقیه خرج می‌کنه؟ اگه قدرت دست توئه و طرف واقعاً بی‌پناه و صادقه (مثل کارگر روزمزد یا دستفروش)، با مروت بگذر تا صداقت و زحمتش بی‌جواب نمونه. اگه نه، برو سؤال بعدی. ۲. اولین بارشه یا تبدیل به الگو شده؟ اگه لغزشِ اوله و داره جبران می‌کنه، یک بار فرصت بده. اگه تکراری شده (مثل مشتریِ ادیت‌خواه یا همکارِ سواری‌گیر)، همون لح const ACTS={};S.forEach(x=>{ACTS[x.act]=(ACTS[x.act]||0)+1});

function render(){const st=window.HS_STATE;if(st&&st.step-1!==lastStep){lastStep=st.step-1;if(lastStep!==i&&lastStep>=0&&lastStep<S.length){i=lastStep;show()}}const tl=document.getElementById('tl');tl.innerHTML='';let tot=0;
 Object.keys(ACTS).forEach(a=>{a=+a;const d=document.createElement('div');d.className='act';d.style.flex=ACTS[a];
  const tk=st?st.takes.filter(t=>t.act==a):[];const last=tk[tk.length-1];let info='ضبط نشده';
  if(last){d.classList.add('done');const dur=last.stop-last.start;tot+=dur;info='برداشت '+fa(tk.length)+' · '+mmss(dur)}
  if(st&&st.recording&&st.rec_act==a){d.classList.remove('done');d.classList.add('rec');info='در حال ضبط · '+mmss(Date.now()/1000-st.rec_start)}
  if(S[i].act==a)d.classList.add('here');
  d.innerHTML='<b>پرده '+fa(a)+'</b>'+info;tl.appendChild(d)});
 document.getElementById('tot').textContent='مجموع ضبط‌شده: '+mmss(tot)+' از حدود ۱۳:۱۵';
 const rd=document.getElementById('recdot');if(st&&st.recording){rd.style.display='block';document.getElementById('rt').textContent=mmss(Date.now()/1000-st.rec_start)}else rd.style.display='none';}
function poll(){const sc=document.createElement('script');sc.src='state.js?t='+Date.now();sc.onload=sc.onerror=()=>{sc.remove();render()};document.body.appendChild(sc)}
setInterval(poll,1000);poll();
</script></body></html>
